name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        testbench: ['10', '11']

    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Testbench major
        run: composer require --no-update "orchestra/testbench:^${{ matrix.testbench }}.0" "orchestra/canvas:^${{ matrix.testbench }}.0"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci
